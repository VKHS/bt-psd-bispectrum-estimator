[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btpsd"
version = "0.1.0"
description = "Bit-accurate models of a memory-based radix-8 FFT power spectral and bispectral estimator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abdolvahab Khalili Sadaghiani" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["btpsd*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
